# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# Minecraft
minecraft_version=26.1.2
minecraft_dependency=[26.1,26.2)
minecraft_suffix=mc26.1
java_target=25
java_dependency=>=25

# Forge
forge_version=64.1.5
forge_dependency=*
javafml_dependency=[1,)
net.minecraftforge.gradle.merge-source-sets=true

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_21

# Mod properties
mod_name=Warp Anchors
mod_description=Quick short range teleportation between Warp Anchors!
mod_id=warpanchors
mod_version=1.0.0
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/warp-anchors
mod_sources=https://github.com/SuperMartijn642/WarpAnchors
mod_issues=https://github.com/SuperMartijn642/WarpAnchors/issues
mod_package=com.supermartijn642.warpanchors
mod_main_class=WarpAnchors
mod_client_class=WarpAnchorsClient
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.1 26.1.1 26.1.2
curseforge_project_id=todo
curseforge_required_dependency_ids=supermartijn642s-core-lib
curseforge_optional_dependency_ids=fusion-connected-textures
modrinth_project_id=todo
modrinth_required_dependency_ids=supermartijn642s-core-lib
modrinth_optional_dependency_ids=fusion-connected-textures

# Dependencies
