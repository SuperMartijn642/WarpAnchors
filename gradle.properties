# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=26.3
minecraft_dependency=>=26.3 <26.4
minecraft_suffix=mc26.3
java_target=25
java_dependency=>=25

# Fabric
fabric_loader_version=0.20.1
fabric_loader_dependency=>=0.19.0
fabric_api_version=0.165.0+26.3
fabric_api_dependency=*

# Mixin
mixin_minimum_version=0.8
mixin_package=mixin
mixin_compatibility_level=JAVA_17

# Mod properties
mod_name=Warp Anchors
mod_description=Quick short range teleportation between Warp Anchors!
mod_id=warpanchors
mod_version=1.0.0
mod_license=All rights reserved
mod_page=https://www.curseforge.com/minecraft/mc-mods/warp-anchors
mod_sources=https://github.com/SuperMartijn642/WarpAnchors
mod_issues=https://github.com/SuperMartijn642/WarpAnchors/issues
mod_package=com.supermartijn642.warpanchors
mod_main_class=WarpAnchors
mod_client_class=WarpAnchorsClient
maven_group=com.supermartijn642

# Publishing
publishing_release_type=stable
publishing_game_versions=26.3
curseforge_project_id=todo
curseforge_required_dependency_ids=fabric-api supermartijn642s-core-lib supermartijn642s-config-lib
curseforge_optional_dependency_ids=fusion-connected-textures
modrinth_project_id=todo
modrinth_required_dependency_ids=fabric-api supermartijn642s-core-lib supermartijn642s-config-lib
modrinth_optional_dependency_ids=fusion-connected-textures

# Dependencies
core_library_file=9354417
core_library_dependency=>=1.1.26 <1.2.0
